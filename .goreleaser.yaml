# Release: push a tag vX.Y.Z whose version matches plugin/.claude-plugin/plugin.json.
# The plugin launcher downloads ccanchor_<version>_<os>_<arch>.tar.gz and
# checks it against ccanchor_<version>_checksums.txt, so keep these names.
version: 2
project_name: ccanchor

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  github:
    owner: p10node
    name: ccanchor
