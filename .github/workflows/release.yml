name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every asset: `gh attestation verify <file> --repo p10node/ccanchor`.
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/ccanchor_${{ steps.v.outputs.version }}_checksums.txt
      # Only now does the plugin move to this version, with the checksums it will accept.
      - name: Pin the checksums in the plugin
        run: scripts/pin-plugin.sh "${{ steps.v.outputs.version }}"
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: scripts/update-formula.sh "${{ steps.v.outputs.version }}"
