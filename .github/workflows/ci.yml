name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Windows still compiles
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .
      - name: Shell scripts parse
        run: for f in plugin/scripts/ccanchor scripts/*.sh; do sh -n "$f"; done
